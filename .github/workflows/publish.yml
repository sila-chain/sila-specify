name: Publish Python Package

on:
  workflow_dispatch:
    inputs:
      authorise_publish:
        description: "Set to YES to publish the selected v* tag to PyPI. Default NO: skipped."
        required: true
        default: "NO"
        type: string

permissions:
  contents: read

jobs:
  notice:
    if: ${{ inputs.authorise_publish != 'YES' || github.ref_type != 'tag' || !startsWith(github.ref_name, 'v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Publication not authorised
        run: |
          echo "Publication skipped."
          echo "Required: authorise_publish=YES and workflow ref must be a v* tag."

  publish:
    if: ${{ inputs.authorise_publish == 'YES' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout selected tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install pinned build tools
        run: python -m pip install --disable-pip-version-check "build==1.6.1" "twine==7.0.0"

      - name: Build distribution
        run: python -m build

      - name: Validate distribution
        run: python -m twine check dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: "__token__"
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload dist/*
